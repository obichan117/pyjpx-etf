name: Daily PCF Snapshot

on:
  schedule:
    - cron: "55 22 * * 0-4"  # 07:55 JST (UTC+9), Mon-Fri
  workflow_dispatch: {}       # manual trigger

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      # Reset GitHub's 60-day inactivity timer so this scheduled workflow
      # is never auto-disabled (disabled_inactivity) again. Calling the
      # enable endpoint on each run keeps it alive without third-party
      # actions (gautamkrishnar/keepalive-workflow is ToS-blocked).
      - name: Keep workflow alive
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-pcf.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      # Download previous DB from release (if exists)
      - name: Download existing DB
        run: gh release download db-latest -p pcf.db -D /tmp || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Run pipeline (also exports the small latest-snapshot-only DB)
      - name: Run PCF pipeline
        run: uv run python -m pyjpx_etf._internal.pipeline_cli --db /tmp/pcf.db --delay 0.3 --latest-out /tmp/pcf-latest.db

      # pcf-latest.db.gz: default `etf sync` asset (a few MB)
      # pcf-full.db.gz:   `etf sync --full` asset for history()
      # pcf.db:           uncompressed full DB, kept for clients <= 0.7.0
      - name: Compress assets
        run: |
          gzip -9 -c /tmp/pcf-latest.db > /tmp/pcf-latest.db.gz
          gzip -9 -c /tmp/pcf.db > /tmp/pcf-full.db.gz

      # Upload updated DB assets to release
      - name: Upload DB to release
        run: |
          gh release upload db-latest /tmp/pcf-latest.db.gz /tmp/pcf-full.db.gz /tmp/pcf.db --clobber 2>/dev/null || \
          gh release create db-latest /tmp/pcf-latest.db.gz /tmp/pcf-full.db.gz /tmp/pcf.db --title "PCF Database" --notes "Daily PCF snapshot. Updated automatically by GitHub Actions."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
